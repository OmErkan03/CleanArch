# scripts/check.conf — the steps behind ./scripts/check (generated at bootstrap, 2026-11-19).
# Format: <name>: <command> — in order, fail fast. [fast] in the NAME = also in ./scripts/check --fast.
# Every step leaves nothing running (docs/testing.md, Resource hygiene).

# Prerequisite: a .NET SDK of major version 10 or newer (projects target net10.0).
requires build: dotnet --version | awk -F. '{ exit ($1 >= 10 ? 0 : 1) }'

# Inventory (Resource hygiene a): `dotnet build` can leave MSBuild worker nodes (node reuse), the
# Roslyn compiler server (VBCSCompiler) and the Razor build server alive. Data left behind: only
# bin/ and obj/ build output (incremental cache, harmless for the next run).
# resource hygiene: no build servers — --disable-build-servers turns off MSBuild node reuse and the
# Roslyn and Razor servers for this invocation.
build [fast]: dotnet build UludagEnerji.slnx --disable-build-servers -nologo -v:q

# --- Planned, activated by spec 0001 (test skeleton); kept as comments until test projects exist.
# Split by selector (trait Category=Integration), never by project list (Two speeds, rule 4).
# The exact filter syntax is fixed in spec 0001 (xUnit v3 on Microsoft.Testing.Platform).
# resource hygiene: --disable-build-servers on every step; test hosts exit with the run.
# test-unit [fast]: dotnet test UludagEnerji.slnx --disable-build-servers --no-build -- --filter-not-trait "Category=Integration"
# Integration needs a container runtime; Testcontainers' reaper (Ryuk) removes the containers at
# the end of the run — the residue test must confirm nothing survives (spec 0001 BUILD).
# requires test-integration: docker info
# test-integration: dotnet test UludagEnerji.slnx --disable-build-servers --no-build -- --filter-trait "Category=Integration"
